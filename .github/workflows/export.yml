name: Terrain export audit
on:
  push:
    branches: [codex/worldcraft-foundation]
permissions:
  contents: write
jobs:
  export:
    if: contains(github.event.head_commit.message, '[export-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: cargo test -p worldcraft-core
      - run: cargo run -p worldcraft-core --bin export-audit
      - name: Official Khronos glTF validator
        run: |
          npm install --prefix "$RUNNER_TEMP/worldcraft-validator" --ignore-scripts --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          NODE_PATH="$RUNNER_TEMP/worldcraft-validator/node_modules" node tools/ci/validate_glb.cjs
      - name: Record validator evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/publish_export_audit.py
