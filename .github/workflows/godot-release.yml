name: Godot desktop prerelease
on:
  push:
    tags: ['v0.2.0-alpha.[0-9]*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux
            editor: linux.x86_64
            template: linux_release.x86_64
            library: libworldcraft_godot.so
            executable: Worldcraft.x86_64
            preset: Linux
          - os: windows-latest
            archive: windows
            editor: win64.exe
            template: windows_release_x86_64.exe
            library: worldcraft_godot.dll
            executable: Worldcraft.exe
            preset: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: godot-desktop
      - name: Install Godot editor and target export template
        shell: bash
        run: |
          python tools/ci/godot_sdk.py "${{ matrix.editor }}" "${{ matrix.template }}"
      - name: Build and test Rust world generation
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --release -p worldcraft-core --locked
          cargo build --release -p worldcraft-godot --locked
          mkdir -p game/bin dist/package
          cp "target/release/${{ matrix.library }}" game/bin/
      - name: Import project and verify bridge
        shell: bash
        run: |
          editor="$(find .godot-sdk -maxdepth 1 -type f -name 'Godot_v*' | head -1)"
          # The first editor scan discovers the extension. Load it at startup
          # on subsequent invocations to avoid the first-scan shutdown crash.
          "$editor" --headless --path game --import --recovery-mode
          timeout 60s "$editor" --headless --path game --log-file "$PWD/dist/integration.log" --script res://tests/integration.gd
          grep -q 'WORLDCRAFT_INTEGRATION_OK' dist/integration.log
      - name: Export and verify package contents
        shell: bash
        run: |
          editor="$(find .godot-sdk -maxdepth 1 -type f -name 'Godot_v*' | head -1)"
          "$editor" --headless --path game --export-release "${{ matrix.preset }}" "$PWD/dist/package/${{ matrix.executable }}"
          test -s "dist/package/${{ matrix.executable }}"
          test -s "dist/package/${{ matrix.library }}"
          cp LICENSE THIRD_PARTY_NOTICES.md licenses/Godot-LICENSE.txt licenses/Godot-COPYRIGHT.txt licenses/MPL-2.0.txt licenses/glam-MIT.txt dist/package/
          cp docs/GODOT_RELEASE.md dist/package/
          cd dist/package
          python -m zipfile -c "../Worldcraft-${{ github.ref_name }}-${{ matrix.archive }}.zip" *
      - name: Build and test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/package-godot-windows.ps1
      - name: Render the procedural landscape gallery
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          LP_NUM_THREADS: 4
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb xauth
          render() {
            local name="$1"
            local resolution="$2"
            local texture="$3"
            local limit=330
            shift 3
            if [[ "$resolution" == 3840x2160 ]]; then limit=580; fi
            if ! timeout "${limit}s" xvfb-run -a -s "-screen 0 ${resolution}x24" dist/package/Worldcraft.x86_64 --resolution "$resolution" --audio-driver Dummy -- --audit --texture "$texture" "$@" --image "$PWD/dist/$name.png" > "dist/$name.log" 2>&1; then
              cat "dist/$name.log"
              return 1
            fi
            cat "dist/$name.log"
            grep -q 'WORLDCRAFT_AUDIT' "dist/$name.log"
            test -s "dist/$name.png"
            if grep -E 'SCRIPT ERROR|SHADER ERROR|^ERROR:' "dist/$name.log"; then return 1; fi
          }
          render woodland 800x500 1024 --seed 421 --preset 0 --hour 8.4 --yaw -88 --pitch -5 --clear-air
          python -c 'import json,sys; scene=json.loads(sys.stdin.read()); assert scene["grass_tufts"] > 30000 and scene["distant_trees"] > 1000' < <(sed -n 's/^WORLDCRAFT_AUDIT //p' dist/woodland.log)
          render alpine 800x500 1024 --seed 324 --preset 1 --hour 10.2 --clear-air
          python -c 'import json,sys; scene=json.loads(sys.stdin.read()); assert scene["inland_lakes"] >= 2' < <(sed -n 's/^WORLDCRAFT_AUDIT //p' dist/alpine.log)
          render river 800x500 1024 --waterfall --hour 8.6 --clear-air
          python -c 'import json,sys; scene=json.loads(sys.stdin.read()); assert scene["scenery_objects"] >= 10000 and scene["scenery_kinds"] >= 10' < <(sed -n 's/^WORLDCRAFT_AUDIT //p' dist/river.log)
          render estuary 800x500 1024 --seed 331 --preset 8 --hour 9.5 --clear-air --rise 5 --pitch -15
          render woodland-4k 3840x2160 4096 --uhd --seed 421 --preset 0 --hour 7.5 --yaw -100 --pitch -3
          python -c 'import json,sys; scene=json.loads(sys.stdin.read()); assert (scene["output_width"], scene["output_height"], scene["render_scale"], scene["texture_side"]) == (3840, 2160, 1.0, 4096) and scene["volumetrics"]' < <(sed -n 's/^WORLDCRAFT_AUDIT //p' dist/woodland-4k.log)
      - uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.archive }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-logs-${{ matrix.archive }}
          path: dist/*.log
          if-no-files-found: ignore
  release:
    needs: desktop
    if: github.repository == 'InduwaraLasindu/Worldcraft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: godot-{windows,linux}
          path: dist
          merge-multiple: true
      - name: Publish checked desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_version="$(sed -n 's/^config\/version="\([^"]*\)"$/\1/p' game/project.godot)"
          case "$GITHUB_REF_NAME" in "v$app_version"|"v$app_version-rc."*) ;; *) exit 1 ;; esac
          cd dist
          test -s "Worldcraft-Setup-$app_version.exe"
          test -s "Worldcraft-$GITHUB_REF_NAME-windows.zip"
          assets=(Worldcraft-*.exe Worldcraft-*.zip *.png)
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS.txt --verify-tag --prerelease --latest=false --title "Worldcraft $app_version — Godot" --notes-file ../docs/GODOT_RELEASE.md
