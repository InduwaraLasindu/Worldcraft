name: Godot desktop prerelease
on:
  push:
    tags: ['v0.2.0-alpha.8*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux
            editor: linux.x86_64
            template: linux_release.x86_64
            library: libworldcraft_godot.so
            executable: Worldcraft.x86_64
            preset: Linux
          - os: windows-latest
            archive: windows
            editor: win64.exe
            template: windows_release_x86_64.exe
            library: worldcraft_godot.dll
            executable: Worldcraft.exe
            preset: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: godot-desktop
      - name: Install Godot editor and target export template
        shell: bash
        run: |
          python tools/ci/godot_sdk.py "${{ matrix.editor }}" "${{ matrix.template }}"
      - name: Build and test Rust world generation
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --release -p worldcraft-core --locked
          cargo build --release -p worldcraft-godot --locked
          mkdir -p game/bin dist/package
          cp "target/release/${{ matrix.library }}" game/bin/
      - name: Import project and verify bridge
        shell: bash
        run: |
          editor="$(find .godot-sdk -maxdepth 1 -type f -name 'Godot_v*' | head -1)"
          # The first editor scan discovers the extension. Load it at startup
          # on subsequent invocations to avoid the first-scan shutdown crash.
          "$editor" --headless --path game --import --recovery-mode
          timeout 60s "$editor" --headless --path game --log-file "$PWD/dist/integration.log" --script res://tests/integration.gd
          grep -q 'WORLDCRAFT_INTEGRATION_OK' dist/integration.log
      - name: Export and verify package contents
        shell: bash
        run: |
          editor="$(find .godot-sdk -maxdepth 1 -type f -name 'Godot_v*' | head -1)"
          "$editor" --headless --path game --export-release "${{ matrix.preset }}" "$PWD/dist/package/${{ matrix.executable }}"
          test -s "dist/package/${{ matrix.executable }}"
          test -s "dist/package/${{ matrix.library }}"
          cp LICENSE THIRD_PARTY_NOTICES.md licenses/Godot-LICENSE.txt licenses/Godot-COPYRIGHT.txt licenses/MPL-2.0.txt dist/package/
          cp docs/GODOT_RELEASE.md dist/package/
          cd dist/package
          python -m zipfile -c "../Worldcraft-${{ github.ref_name }}-${{ matrix.archive }}.zip" *
      - name: Build and test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/package-godot-windows.ps1
      - name: Render the Linux package
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb xauth
          timeout 280s xvfb-run -a dist/package/Worldcraft.x86_64 --resolution 640x400 --audio-driver Dummy -- --audit --waterfall --image "$PWD/dist/river.png" > dist/render.log 2>&1
          cat dist/render.log
          grep -q 'WORLDCRAFT_AUDIT' dist/render.log
          test -s dist/river.png
          ! grep -E 'SCRIPT ERROR|SHADER ERROR|^ERROR:' dist/render.log
      - uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.archive }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-logs-${{ matrix.archive }}
          path: dist/*.log
          if-no-files-found: ignore
  release:
    needs: desktop
    if: ${{ !cancelled() && github.repository == 'InduwaraLasindu/Worldcraft' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: godot-{windows,linux}
          path: dist
          merge-multiple: true
      - name: Publish checked desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          test -s Worldcraft-Setup-0.2.0-alpha.8.exe
          test -s "Worldcraft-$GITHUB_REF_NAME-windows.zip"
          assets=(Worldcraft-*.exe Worldcraft-*.zip)
          if [ -s river.png ]; then assets+=(river.png); fi
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS.txt --verify-tag --prerelease --latest=false --title "Worldcraft 0.2.0-alpha.8 — Godot" --notes-file ../docs/GODOT_RELEASE.md
