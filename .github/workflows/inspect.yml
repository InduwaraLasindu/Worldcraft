name: Inspect captured native frames
on:
  push:
    branches: [codex/worldcraft-visual-qa]
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare text transport for exact captured PNGs
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ["cloud-balanced","cloud-home","cloud-high","cloud-smoke"]:
              p=Path("docs/media")/(name+".png")
              (p.with_suffix(".base64.txt")).write_text(base64.b64encode(p.read_bytes()).decode("ascii"),encoding="ascii")
          PY
      - name: Save inspection previews
        run: |
          git config user.name 'Worldcraft CI'
          git config user.email 'worldcraft-ci@users.noreply.github.com'
          git add docs/media/*.base64.txt
          git commit -m "test: prepare exact native captures for visual inspection"
          git push
