name: Linux renderer verification fallback
on:
  push:
    branches: [codex/worldcraft-linux-render-check]
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: linux-render-fallback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a58a3d45988fcb9bc1dea22a4a7cdbd3035aeebe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: resource-limits-${{ runner.os }}
          cache-on-failure: true
      - name: Linux graphics and native SDK compiler
        if: runner.os == 'Linux'
        run: timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libudev-dev libx11-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1 libvulkan1 libclang-dev mesa-vulkan-drivers xvfb xauth x11-apps imagemagick
      - name: Windows SDK binding compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang='C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath "$clang\libclang.dll")) {throw 'Hosted LLVM libclang is missing'}
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pinned official NVIDIA and AMD build/runtime inputs
        run: python tools/ci/bootstrap_upscalers.py
      - name: Pinned embedded materials
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.3.5
          python tools/prepare_materials.py
      - run: cargo fmt --all -- --check
      - run: cargo test -p worldcraft-core -p worldcraft-ml --locked
      - run: cargo clippy -p worldcraft-core -p worldcraft-ml --all-targets --locked
      - name: Real vendor integration, optimized executable
        run: cargo build --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft --features nvidia-dlss --locked
      - name: Desktop, history, lifetime and resource-policy regressions
        run: cargo test --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft --features nvidia-dlss --locked
      - name: Copy verified release runtimes beside the candidate
        shell: bash
        run: python tools/ci/bootstrap_upscalers.py --root "$WORLDCRAFT_UPSCALER_ROOT" --copy-to target/${{ runner.os == 'Windows' && 'release' || 'ci' }}
      - name: Download, path and renderer-log gate regressions
        run: |
          python tools/ci/test_native_audit.py
          python tools/ci/test_bootstrap_ort.py
          python tools/ci/test_upscaler_inputs.py
      - name: Native inference runtime
        run: python tools/ci/bootstrap_ort.py
      - name: Native fast inference with nonspinning sessions
        shell: bash
        run: cargo run --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft-ml --bin audit -- "$WORLDCRAFT_ORT_DYLIB" "$RUNNER_TEMP/worldcraft-models" candidate-learned.worldcraft.json
      - name: Existing Linux camera, terrain, idle and ray routes
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = a58a3d45988fcb9bc1dea22a4a7cdbd3035aeebe
          timeout 180s python3 tools/ci/run_native_audit.py native-calibration.log xvfb-run -a ./target/ci/worldcraft --calibration-audit
          timeout 360s python3 tools/ci/run_native_audit.py native-eco.log xvfb-run -a ./target/ci/worldcraft --eco-smoke-test --eco-horizon-audit
          mv worldcraft-learned.png worldcraft-eco.png
          python3 tools/ci/check_eco_images.py
          timeout 360s python3 tools/ci/run_native_audit.py native-auto.log xvfb-run -a ./target/ci/worldcraft --auto-smoke-test
          mv worldcraft-learned.png worldcraft-auto.png
          timeout 180s python3 tools/ci/run_native_audit.py native-idle.log xvfb-run -a python3 tools/ci/idle_audit.py ./target/ci/worldcraft
          timeout 720s python3 tools/ci/run_native_audit.py native-scene.log xvfb-run -a ./target/ci/worldcraft --smoke-test
      - name: Real native reconstruction and lens captures
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = a58a3d45988fcb9bc1dea22a4a7cdbd3035aeebe
          timeout 720s python3 tools/ci/run_native_audit.py native-render-settings.log xvfb-run -a ./target/ci/worldcraft --render-smoke-test
          python3 tools/ci/check_render_images.py
      - name: Latest untouched nature and biome captures
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = a58a3d45988fcb9bc1dea22a4a7cdbd3035aeebe
          timeout 480s python3 tools/ci/run_native_audit.py native-nature.log xvfb-run -a ./target/ci/worldcraft --nature-smoke-test
          python3 tools/ci/check_nature_images.py
          timeout 900s python3 tools/ci/run_native_audit.py native-biomes.log xvfb-run -a ./target/ci/worldcraft --biome-smoke-test
          python3 tools/ci/check_biome_images.py
      - name: Windows shader compiler
        if: runner.os == 'Windows'
        run: python tools/ci/bootstrap_dxc.py
      - name: Windows launch calibration and frustum culling
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-windows-calibration.ps1
      - name: Windows native AA and lens route
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-render-settings.ps1
      - name: Installer, portable and real packaged-world checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/validate-package-scripts.ps1
          ./tools/package-windows.ps1
          ./tools/test-windows-render.ps1
          ./tools/test-detailed-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-quality-Linux-fallback
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
            *audit*.json
            calibration-*.log
            native-*.log
            worldcraft-*.png
            crates/worldcraft/embedded/manifest.json
          if-no-files-found: ignore
