name: Native nature preview
on:
  push:
    branches: [codex/worldcraft-nature-realism]
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: write
concurrency:
  group: nature-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nature-preview-windows-ci
          cache-on-failure: true
      - name: Prepare pinned embedded materials
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.3.5
          python tools/prepare_materials.py
      - run: cargo test --profile ci -p worldcraft --locked
      - run: cargo build --profile ci -p worldcraft --locked
      - name: Fast native software DX12 graphics and memory check
        shell: pwsh
        run: ./tools/test-windows-render.ps1 -Profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-preview
          path: |
            native-windows*.log
            windows-render-*-audit.json
            worldcraft-*.png
          if-no-files-found: ignore
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: resource-limits-${{ runner.os }}
          cache-on-failure: true
      - name: Native graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1 libvulkan1 mesa-vulkan-drivers xvfb xauth x11-apps imagemagick
      - name: Prepare verified material maps
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.3.5
          python tools/prepare_materials.py
      - run: cargo fmt --all -- --check
      - run: cargo test --profile ci -p worldcraft --locked
      - run: cargo build --profile ci -p worldcraft --locked
      - name: Native species and surface captures
        run: |
          timeout 480s python3 tools/ci/run_native_audit.py native-nature.log xvfb-run -a ./target/ci/worldcraft --nature-smoke-test
          python3 tools/ci/check_nature_images.py
      - name: Native procedural biome route
        run: |
          timeout 900s python3 tools/ci/run_native_audit.py native-biomes.log xvfb-run -a ./target/ci/worldcraft --biome-smoke-test
          python3 tools/ci/check_biome_images.py
      - name: Retain immutable native evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci/publish_nature_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-nature-preview
          path: |
            nature-render-audit.json
            biome-render-audit.json
            native-nature.log
            native-biomes.log
            worldcraft-nature-*.png
            worldcraft-biome-*.png
            crates/worldcraft/embedded/manifest.json
          if-no-files-found: ignore
