name: Nature realism audit
on:
  push:
    branches: [codex/worldcraft-nature-realism]
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: nature-realism-${{ github.ref }}
  # Finish native builds so their dependency cache survives; keep only the latest queued run.
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: resource-limits-${{ runner.os }}
          cache-on-failure: true
      - name: Linux native graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1 libvulkan1 mesa-vulkan-drivers xvfb xauth x11-apps imagemagick
      - name: Prepare pinned CC0 embedded materials
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.3.5
          python tools/prepare_materials.py
      - run: cargo fmt --all -- --check
      - run: cargo test -p worldcraft-core -p worldcraft-ml --locked
      - run: cargo clippy -p worldcraft-core -p worldcraft-ml --all-targets --locked
      - name: Build optimized candidate
        run: cargo build --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft --locked
      - name: Desktop regressions and resource policies
        run: cargo test --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft --locked
      - name: Native renderer log gate regressions
        run: python tools/ci/test_native_audit.py
      - name: Native inference runtime
        run: python tools/ci/bootstrap_ort.py
      - name: Native fast inference with nonspinning sessions
        shell: bash
        run: cargo run --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft-ml --bin audit -- "$WORLDCRAFT_ORT_DYLIB" "$RUNNER_TEMP/worldcraft-models" candidate-learned.worldcraft.json
      - name: Eco scene and idle resource measurement
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 180s python3 tools/ci/run_native_audit.py native-calibration.log xvfb-run -a ./target/ci/worldcraft --calibration-audit
          timeout 360s python3 tools/ci/run_native_audit.py native-eco.log xvfb-run -a ./target/ci/worldcraft --eco-smoke-test
          mv worldcraft-learned.png worldcraft-eco.png
          timeout 360s python3 tools/ci/run_native_audit.py native-auto.log xvfb-run -a ./target/ci/worldcraft --auto-smoke-test
          mv worldcraft-learned.png worldcraft-auto.png
          timeout 180s python3 tools/ci/run_native_audit.py native-idle.log xvfb-run -a python3 tools/ci/idle_audit.py ./target/ci/worldcraft
          timeout 720s python3 tools/ci/run_native_audit.py native-scene.log xvfb-run -a ./target/ci/worldcraft --smoke-test
      - name: Native nature and material fixture
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: timeout 360s python3 tools/ci/run_native_audit.py native-nature.log xvfb-run -a ./target/ci/worldcraft --nature-smoke-test
      - name: Windows shader compiler
        if: runner.os == 'Windows'
        run: python tools/ci/bootstrap_dxc.py
      - name: Windows launch calibration and frustum culling
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-windows-calibration.ps1
      - name: Package and check installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/validate-package-scripts.ps1
          ./tools/package-windows.ps1
          ./tools/test-windows-render.ps1
          ./tools/test-detailed-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nature-realism-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
            *audit*.json
            docs/ADAPTIVE_AUDIT.md
            calibration-*.log
            native-*.log
            worldcraft-*.png
          if-no-files-found: ignore
