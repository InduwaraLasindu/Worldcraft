name: Worldcraft website
on:
  push:
    branches: [main, codex/worldcraft-website]
    paths:
      - 'website/**'
      - 'docs/media/**'
      - 'tools/package-site.mjs'
      - 'tools/check-site.mjs'
      - 'tools/site-browser-check.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/media/**'
      - 'tools/package-site.mjs'
      - 'tools/check-site.mjs'
      - 'tools/site-browser-check.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_QA_DEPS: ${{ runner.temp }}/worldcraft-site-qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Package static site
        run: node tools/package-site.mjs
      - name: Check scripts and packaged links
        run: |
          node --check website/app.js
          node --check tools/package-site.mjs
          node --check tools/check-site.mjs
          node --check tools/site-browser-check.mjs
          node tools/check-site.mjs
      - name: Install browser QA on the hosted runner
        run: |
          npm install --prefix "$SITE_QA_DEPS" --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.65.1 axe-core@4.14.0
          node "$SITE_QA_DEPS/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify responsive layout, accessibility and interactions
        run: node tools/site-browser-check.mjs
      - name: Preserve browser captures and accessibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-browser-review
          path: _site-qa/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site/
  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
