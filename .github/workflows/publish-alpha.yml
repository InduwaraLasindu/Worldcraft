name: Publish verified alpha
on:
  push:
    branches: [codex/worldcraft-foundation]
permissions:
  contents: read
concurrency:
  group: worldcraft-alpha-publication
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[worldcraft-publish-alpha]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate provenance and publish the alpha prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORLDCRAFT_VERIFIED_RUN: '43825109452'
        run: python tools/ci/publish_alpha.py
