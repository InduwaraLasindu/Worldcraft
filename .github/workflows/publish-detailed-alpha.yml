name: Publish verified detailed alpha
on:
  push:
    branches: [codex/worldcraft-diffusion-detail]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[detail-publish]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify existing uploaded bytes and publish the reviewed alpha
        run: python3 tools/ci/publish_detailed_alpha.py
