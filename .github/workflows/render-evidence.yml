name: Retain native renderer screenshots
on:
  push:
    branches: [codex/worldcraft-render-evidence]
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: render-quality-Linux
          run-id: 44250142452
          github-token: ${{ github.token }}
          path: native-captures
      - name: Retain unchanged pixels and source provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WORLDCRAFT_CAPTURE_SOURCE: a58a3d45988fcb9bc1dea22a4a7cdbd3035aeebe
          WORLDCRAFT_CAPTURE_RUN: '44250142452'
        run: python3 tools/ci/publish_render_evidence.py native-captures
