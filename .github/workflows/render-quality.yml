name: Native renderer and Windows package
on:
  push:
    branches: [codex/worldcraft-render-quality, codex/worldcraft-forest-floor, codex/worldcraft-material-relief, codex/worldcraft-forest-light, codex/worldcraft-woodland-canopy, codex/worldcraft-tidal-estuary, codex/worldcraft-atmospheric-surfaces]
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: render-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: resource-limits-${{ runner.os }}
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Linux graphics and native SDK compiler
        if: runner.os == 'Linux'
        run: |
          opts=(-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y libudev-dev libx11-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1 libvulkan1 libclang-dev mesa-vulkan-drivers xvfb xauth x11-apps imagemagick
      - name: Windows SDK binding compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang='C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath "$clang\libclang.dll")) {throw 'Hosted LLVM libclang is missing'}
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pinned official NVIDIA and AMD build/runtime inputs
        run: python tools/ci/bootstrap_upscalers.py
      - name: Pinned embedded materials
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.3.5
          python tools/prepare_materials.py
          python tools/ci/test_relief_materials.py
      - run: cargo fmt --all -- --check
      - run: cargo test -p worldcraft-core -p worldcraft-ml --locked
      - run: cargo clippy -p worldcraft-core -p worldcraft-ml --all-targets --locked
      - name: Real vendor integration, optimized executable
        run: cargo build --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft --features nvidia-dlss --locked
      - name: Desktop, history, lifetime and resource-policy regressions
        run: cargo test --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft --features nvidia-dlss --locked
      - name: Copy verified release runtimes beside the candidate
        shell: bash
        run: python tools/ci/bootstrap_upscalers.py --root "$WORLDCRAFT_UPSCALER_ROOT" --copy-to target/${{ runner.os == 'Windows' && 'release' || 'ci' }}
      - name: Download, path and renderer-log gate regressions
        run: |
          python tools/ci/test_native_audit.py
          python tools/ci/test_bootstrap_ort.py
          python tools/ci/test_upscaler_inputs.py
      - name: Fixed-camera 4K relief, forest floor, sunset coast and snow
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 720s python3 tools/ci/run_native_audit.py native-relief.log xvfb-run -a ./target/ci/worldcraft --material-relief-test
          python3 tools/ci/check_relief_images.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: material-relief-views
          path: |
            relief-*.json
            worldcraft-relief-*.png
            native-relief.log
          if-no-files-found: error
      - name: Capture untouched biomes and the moving woodland route
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 900s python3 tools/ci/run_native_audit.py native-biomes.log xvfb-run -a ./target/ci/worldcraft --biome-smoke-test
          python3 tools/ci/check_biome_images.py
          timeout 600s python3 tools/ci/run_native_audit.py native-forest-travel.log xvfb-run -a ./target/ci/worldcraft --forest-travel-test
          python3 tools/ci/check_forest_travel.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: forest-native-views
          path: |
            biome-render-audit.json
            forest-travel-audit.json
            worldcraft-biome-*.png
            worldcraft-travel-*.png
            worldcraft-material-*.png
            native-biomes.log
            native-forest-travel.log
          if-no-files-found: error
      - name: Native inference runtime
        run: python tools/ci/bootstrap_ort.py
      - name: Native fast inference with nonspinning sessions
        shell: bash
        run: cargo run --profile ${{ runner.os == 'Windows' && 'release' || 'ci' }} -p worldcraft-ml --bin audit -- "$WORLDCRAFT_ORT_DYLIB" "$RUNNER_TEMP/worldcraft-models" candidate-learned.worldcraft.json
      - name: Existing Linux camera, terrain, idle and ray routes
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 180s python3 tools/ci/run_native_audit.py native-calibration.log xvfb-run -a ./target/ci/worldcraft --calibration-audit
          timeout 360s python3 tools/ci/run_native_audit.py native-eco.log xvfb-run -a ./target/ci/worldcraft --eco-smoke-test --eco-horizon-audit
          mv worldcraft-learned.png worldcraft-eco.png
          python3 tools/ci/check_eco_images.py
          timeout 360s python3 tools/ci/run_native_audit.py native-auto.log xvfb-run -a ./target/ci/worldcraft --auto-smoke-test
          mv worldcraft-learned.png worldcraft-auto.png
          timeout 180s python3 tools/ci/run_native_audit.py native-idle.log xvfb-run -a python3 tools/ci/idle_audit.py ./target/ci/worldcraft
          timeout 720s python3 tools/ci/run_native_audit.py native-scene.log xvfb-run -a ./target/ci/worldcraft --smoke-test
      - name: Real native reconstruction and lens captures
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 720s python3 tools/ci/run_native_audit.py native-render-settings.log xvfb-run -a ./target/ci/worldcraft --render-smoke-test
          python3 tools/ci/check_render_images.py
      - name: Latest untouched nature and biome captures
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          timeout 480s python3 tools/ci/run_native_audit.py native-nature.log xvfb-run -a ./target/ci/worldcraft --nature-smoke-test
          python3 tools/ci/check_nature_images.py
      - name: Windows shader compiler
        if: runner.os == 'Windows'
        run: python tools/ci/bootstrap_dxc.py
      - name: Windows launch calibration and frustum culling
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-windows-calibration.ps1
      - name: Retain verified Windows candidate before long graphics checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/validate-package-scripts.ps1
          ./tools/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-candidate
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Windows native AA and lens route
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/test-render-settings.ps1 -Relief
          ./tools/test-render-settings.ps1
      - name: Installer, portable and real packaged-world checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/test-windows-render.ps1
          ./tools/test-detailed-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-quality-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
            *audit*.json
            calibration-*.log
            native-*.log
            worldcraft-*.png
            crates/worldcraft/embedded/manifest.json
          if-no-files-found: ignore
  publish:
    needs: verify
    if: >-
      github.repository == 'InduwaraLasindu/Worldcraft' &&
      ((github.ref_name == 'codex/worldcraft-render-quality' && contains(github.event.head_commit.message, '[release-alpha5]')) ||
       (github.ref_name == 'codex/worldcraft-forest-floor' && contains(github.event.head_commit.message, '[release-alpha6]')) ||
       (github.ref_name == 'codex/worldcraft-material-relief' && contains(github.event.head_commit.message, '[release-alpha7]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: render-quality-Windows
          path: verified-windows
      - uses: actions/download-artifact@v4
        with:
          name: render-quality-Linux
          path: verified-linux
      - name: Verify exact-source assets and publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/verify_release_candidate.py verified-windows verified-linux
          (cd verified-windows/dist && sha256sum --check SHA256SUMS.txt)
          if [[ "$GITHUB_REF_NAME" == "codex/worldcraft-material-relief" ]]; then
            version=v0.2.0-alpha.7
            files=(verified-linux/worldcraft-relief-{rock-flat,rock-pom,floor-pom,coast-sunset,snow-line}.png)
            notes=docs/ALPHA7_RELEASE.md
            title="WorldCraft 0.2.0-alpha.7 — procedural material relief"
            archive=Worldcraft-alpha7-native-evidence.zip
            python3 tools/ci/verify_release_candidate.py --forest verified-linux
            python3 tools/ci/verify_release_candidate.py --relief verified-windows verified-linux
          elif [[ "$GITHUB_REF_NAME" == "codex/worldcraft-forest-floor" ]]; then
            version=v0.2.0-alpha.6
            files=(verified-linux/worldcraft-biome-{woodland,alpine,savanna,birch,tropical,meadow}.png)
            notes=docs/ALPHA6_RELEASE.md
            title="WorldCraft 0.2.0-alpha.6 — procedural landscapes"
            archive=Worldcraft-alpha6-native-evidence.zip
            python3 tools/ci/verify_release_candidate.py --forest verified-linux
          else
            version=v0.2.0-alpha.5
            files=()
            notes=docs/ALPHA5_RELEASE.md
            title="WorldCraft 0.2.0-alpha.5 — renderer test build"
            archive=Worldcraft-alpha5-native-evidence.zip
          fi
          (cd verified-linux && zip -q -r "../$archive" .)
          gh release create "$version" verified-windows/dist/*.exe verified-windows/dist/*.zip verified-windows/dist/SHA256SUMS.txt "$archive" "${files[@]}" --target "$GITHUB_SHA" --prerelease --latest=false --title "$title" --notes-file "$notes"
