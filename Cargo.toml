[workspace]
members = ["crates/worldcraft-core", "crates/worldcraft-ml", "crates/worldcraft"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/InduwaraLasindu/Worldcraft"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
opt-level = 1
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "debuginfo"

[profile.ci.package."*"]
opt-level = 1
