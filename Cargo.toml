[workspace]
members = ["crates/worldcraft-core", "crates/worldcraft-ml", "crates/worldcraft", "crates/worldcraft-godot"]
default-members = ["crates/worldcraft-core", "crates/worldcraft-godot"]
resolver = "2"
exclude = ["vendor/bevy_render"]

[workspace.package]
version = "0.2.0-alpha.15"
edition = "2021"
license = "MIT"
repository = "https://github.com/InduwaraLasindu/Worldcraft"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
opt-level = 1
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "debuginfo"

[profile.ci.package."*"]
opt-level = 1

[patch.crates-io]
# Preserve explicit DX12 selection when the raw-Vulkan SDK feature is compiled.
bevy_render = { path = "vendor/bevy_render" }
