[package]
name = "worldcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Uses Bevy's real NGX/Vulkan integration. SDKs are build inputs; only the
# redistributable runtime and its notices accompany an enabled distribution.
nvidia-dlss = ["bevy/dlss"]

[dependencies]
worldcraft-core = { path = "../worldcraft-core" }
worldcraft-ml = { path = "../worldcraft-ml" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
flate2 = "1"
bevy = { version = "=0.20.1", default-features = false, features = [
  "default_app", "std", "multi_threaded", "bevy_winit", "x11",
  "3d_bevy_render", "bevy_solari", "scene", "mouse", "keyboard",
  "smaa_luts", "tonemapping_luts", "zstd_rust", "raw_vulkan_init", "bevy_audio", "wav"
] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["default_fonts", "render", "open_url"] }

rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# The Vulkan interop code is type-checked on Linux too; AMD's signed runtime
# itself is loaded only on Windows x64. These versions match Bevy's wgpu graph.
ash = { version = "0.38", default-features = false, features = ["std"] }
libloading = "0.8"
wgpu = { version = "=30.0.2", default-features = false, features = ["vulkan"] }

[build-dependencies]
cc = "1"
