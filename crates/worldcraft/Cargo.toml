[package]
name = "worldcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
worldcraft-core = { path = "../worldcraft-core" }
serde.workspace = true
serde_json.workspace = true
bevy = { version = "=0.16.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_color",
  "bevy_core_pipeline", "bevy_log", "bevy_pbr", "bevy_render",
  "bevy_winit", "bevy_window", "bevy_gizmos", "png",
  "tonemapping_luts", "ktx2", "zstd", "x11"
] }
bevy_egui = { version = "=0.34.1", default-features = false, features = ["default_fonts", "render"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
